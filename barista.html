<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pha Chế (Bếp KDS) - Poly Coffee</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- TOP NAVBAR (CHỈ HIỂN THỊ THÔNG TIN PHIÊN LÀM VIỆC CỦA BARISTA & NÚT ĐĂNG XUẤT) -->
    <header class="top-navbar no-print">
        <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-4">
                <a href="#" class="brand-logo">
                    <i class="fa-solid fa-mug-hot"></i>
                    <span>POLY COFFEE</span>
                </a>
                <span class="nav-clock d-none d-sm-inline-flex" title="Thời gian hiện tại">
                    <i class="fa-regular fa-clock"></i>
                    <span id="currentTime">--:--</span>
                </span>
                <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold">
                    <i class="fa-solid fa-blender me-1"></i>QUẦY PHA CHẾ (KDS)
                </span>
            </div>

            <!-- LOGGED IN USER & LOGOUT -->
            <div class="d-flex align-items-center gap-3">
                <div class="text-end d-none d-sm-block">
                    <div class="fw-bold text-white" id="navbarUserName">Lê Hoàng Nam</div>
                    <small class="text-warning fw-semibold" id="navbarUserRole">Pha Chế Barista</small>
                </div>
                <button class="btn btn-outline-danger btn-sm rounded-pill px-3 text-white border-light" onclick="logout()" title="Đăng xuất khỏi quầy">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Đăng Xuất
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN BARISTA INTERFACE -->
    <main class="container-fluid p-3 p-lg-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold text-primary mb-0"><i class="fa-solid fa-blender me-2"></i>MÀN HÌNH BẾP & PHA CHẾ (KDS)</h4>
                <small class="text-muted">Nhận đơn hàng tức thì từ thu ngân, cập nhật tiến độ pha chế và bấm xác nhận làm xong</small>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary rounded-pill px-3 shadow-sm" onclick="renderBaristaOrders()">
                    <i class="fa-solid fa-rotate me-1"></i>Làm Mới
                </button>
            </div>
        </div>

        <!-- 3 KDS COLUMNS -->
        <div class="row g-3">
            <!-- Cột 1: Chờ pha chế -->
            <div class="col-md-4">
                <div class="p-3 rounded-4 shadow-sm border border-warning border-opacity-50 h-100" style="background-color: var(--bg-card);">
                    <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom border-dark">
                        <h6 class="fw-bold text-warning text-uppercase mb-0">
                            <i class="fa-solid fa-hourglass-start me-2"></i>Đơn Chờ Làm (<span id="countPending">0</span>)
                        </h6>
                        <span class="badge bg-warning text-dark rounded-pill">Mới nhận</span>
                    </div>
                    <div id="kitchenPendingList" class="d-flex flex-column gap-3" style="max-height: 75vh; overflow-y: auto;">
                        <!-- Cards -->
                    </div>
                </div>
            </div>

            <!-- Cột 2: Đang pha chế -->
            <div class="col-md-4">
                <div class="p-3 rounded-4 shadow-sm border border-info border-opacity-50 h-100" style="background-color: var(--bg-card);">
                    <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom border-dark">
                        <h6 class="fw-bold text-info text-uppercase mb-0">
                            <i class="fa-solid fa-fire-burner me-2"></i>Đang Pha Chế (<span id="countBrewing">0</span>)
                        </h6>
                        <span class="badge bg-info text-white rounded-pill">Đang chuẩn bị</span>
                    </div>
                    <div id="kitchenBrewingList" class="d-flex flex-column gap-3" style="max-height: 75vh; overflow-y: auto;">
                        <!-- Cards -->
                    </div>
                </div>
            </div>

            <!-- Cột 3: Đã làm xong -->
            <div class="col-md-4">
                <div class="p-3 rounded-4 shadow-sm border border-success border-opacity-50 h-100" style="background-color: var(--bg-card);">
                    <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom border-dark">
                        <h6 class="fw-bold text-success text-uppercase mb-0">
                            <i class="fa-solid fa-check-double me-2"></i>Đã Xong - Chờ Khách Lấy (<span id="countReady">0</span>)
                        </h6>
                        <span class="badge bg-success rounded-pill">Sẵn sàng</span>
                    </div>
                    <div id="kitchenReadyList" class="d-flex flex-column gap-3" style="max-height: 75vh; overflow-y: auto;">
                        <!-- Cards -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Shared JS -->
    <script src="js/data.js"></script>
    <!-- Barista JS -->
    <script src="js/barista.js"></script>
</body>
</html>
